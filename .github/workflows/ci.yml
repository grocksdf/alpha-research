name: Offline tests and release integrity
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    env:
      BRAIN_EMAIL: ''
      BRAIN_PASSWORD: ''
      LLM_API_KEY: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/release.py --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/release.py --output dist/AlphaResearch.zip --verify-archive dist/AlphaResearch.zip
