required_checks = ["LOW_SHARPE", "LOW_FITNESS", "CONCENTRATED_WEIGHT"]
# 固定研究诊断参数；不是平台官方门槛，不允许 Agent 修改或按结果调窗。
stability_window_sessions = 126
min_stability_windows = 4
stability_annualization = 252
min_positive_window_fraction = 0.67
min_window_sharpe = -0.25
min_sensitivity_neighbors = 2
min_neighbor_sharpe_ratio = 0.70
min_neighbor_fitness = 0.70
max_abs_pool_correlation = 0.70
min_pnl_overlap = 252
