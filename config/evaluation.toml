# 全部是示例研究阈值，不是官方提交要求。负责人按账户规则审核后才可置 verified。
version = "research-v2-fixed-session-windows"
min_sharpe = 1.25
min_fitness = 1.0
min_turnover = 0.01
max_turnover = 0.70
max_abs_self_correlation = 0.70
require_production_correlation = false
