mode = "demo"
database = "state/research.sqlite3"
catalog = "config/catalog.demo.json"
evaluation = "config/evaluation.toml"
program = "program.md"
account_profile_verified = false
account_profile_note = "尚未使用当前账户核实接口、检查项和提交规则"

[scope]
instrumentType = "EQUITY"
region = "USA"
universe = "TOP3000"
delay = 1
language = "FASTEXPR"
decay = 4
neutralization = "SUBINDUSTRY"
truncation = 0.08
pasteurization = "ON"
unitHandling = "VERIFY"
nanHandling = "OFF"
visualization = false

[brain]
base_url = "https://api.worldquantbrain.com"
timeout_seconds = 30
poll_deadline_seconds = 900
max_get_attempts = 100
authentication = "/authentication"
simulations = "/simulations"
alpha = "/alphas/{id}"
# 账户列表 schema 仍需真实账户验收；恢复只用 GET，分页不完整时拒绝认领。
alpha_list = "/users/self/alphas"
recovery_max_alphas = 1000
recovery_page_size = 100
check = "/alphas/{id}/check"
self_correlation = "/alphas/{id}/correlations/self"
production_correlation = "/alphas/{id}/correlations/prod"
# 社区约定，需用自己账户验证。404/未知 schema 会使稳健性证据不完整。
yearly = "/alphas/{id}/recordsets/yearly-stats"
pnl = "/alphas/{id}/recordsets/pnl"
submit = "/alphas/{id}/submit"
fields = "/data-fields"
operators = "/operators"
user = "/users/self"

[brain.discovery_evidence]
# 默认不假设平台存在任何具体日期字段。须先用当前账户核实字段及其语义。
schema_reviewed = false
review_note = ""
date_semantics = "unverified"
is_start_path = []
is_end_path = []

[brain.pnl_evidence]
reviewed = false
review_note = ""
value_semantics = "unverified"
pnl_unit = "unverified"
capital_unit = "unverified"
capital_path = []
calendar_reviewed = false
calendar_id = ""
calendar_source = ""
calendar_review_note = ""
calendar_region = ""
calendar_start = ""
calendar_end = ""
calendar_file = ""
calendar_sha256 = ""
# v0.5: unknown costs block normalized-return robustness reports. No defaults
# for fees, slippage or net/gross status are inferred from a PnL field name.
costs_reviewed = false
net_of_costs = "unverified"
cost_model_id = ""
cost_review_note = ""

[llm]
# 兼容 Chat Completions + tools 的供应商；KEY 只从环境读取。
base_url = "https://api.openai.com/v1"
model = ""
timeout_seconds = 90

[safety]
live_research_enabled = false
submission_enabled = false
validated_probe_record = ""

[research]
paper_search_enabled = false
max_paper_requests_per_run = 5
max_papers_per_search = 5
max_notes_per_run = 30

[cost]
# 负责人按供应商价格填入每百万 token 美元价格；缺省不推测费用。
# input_per_million_usd = 0.0
# output_per_million_usd = 0.0

[validation]
# 独立于每次研究的 --ledger；所有研究共享。不要随实验重建/改路径。
holdout_registry = "state/holdout-registry.sqlite3"
