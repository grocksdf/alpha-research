project:
  name: AlphaResearch
  database: data/research.db
  program: program.md

brain:
  base_url: https://api.worldquantbrain.com
  timeout_seconds: 45
  poll_timeout_seconds: 900
  max_retries: 5
  simulation:
    instrumentType: EQUITY
    region: USA
    universe: TOP3000
    delay: 1
    decay: 4
    neutralization: SECTOR
    truncation: 0.08
    pasteurization: "ON"
    unitHandling: VERIFY
    nanHandling: "ON"
    language: FASTEXPR
    visualization: false

research:
  model: gpt-5-mini
  max_simulations_per_run: 15
  candidates_per_iteration: 5
  memory_limit: 20

validation:
  max_nodes: 80
  max_depth: 12
  max_duplicate_subtree: 3
  max_window: 756
  forbidden_operators:
    - lead
    - ts_lead
    - future_return

evaluation:
  # These are local gates, not claims about current official platform thresholds.
  min_sharpe: 1.25
  min_fitness: 1.0
  min_turnover: 0.01
  max_turnover: 0.70
  max_drawdown: 0.35
  min_years: 3
  min_positive_year_fraction: 0.60
  max_self_correlation: 0.70
  max_production_correlation: 0.70
  weights:
    sharpe: 0.25
    fitness: 0.20
    turnover: 0.10
    drawdown: 0.10
    year_stability: 0.20
    novelty: 0.15

submission:
  automatic_submit: false
  human_approval_required: true

