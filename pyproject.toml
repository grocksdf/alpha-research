[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research"
version = "0.8.2"
description = "LLM-only evidence-bound autonomous Alpha research and safety-gated BRAIN workflow"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
alpha-research = "alpharesearch.cli:main"
alpha-research-v08 = "alpharesearch.v08_cli:main"

[tool.setuptools.packages.find]
include = ["alpharesearch*", "benchmarks*"]
