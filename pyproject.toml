[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alpha-research"
version = "0.1.0"
description = "A constrained research loop for WorldQuant BRAIN FASTEXPR alphas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.50,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
alpha-research = "alpharesearch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/alpharesearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

